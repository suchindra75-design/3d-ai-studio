[project]
name = "ai3d-backend"
version = "0.1.0"
description = "AI 3D Studio backend: REST API, database, storage and processing pipelines"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ai3d-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "python-multipart>=0.0.18",
    "pillow>=11.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "platformdirs>=4.3",
    "httpx2>=2.16",
    "trimesh>=4.5",
    # trimesh needs these to write and read 3MF (every export is re-opened to validate it).
    "networkx>=3.3",
    "lxml>=5.3",
    # Quadric decimation (used by trimesh); light, MIT.
    "fast-simplification>=0.1.9",
    # Decodes Draco-compressed glTF meshes (KHR_draco_mesh_compression), which some
    # providers return; without it such files cannot be checked. Apache-2.0.
    "DracoPy>=2.0",
    "cryptography>=44",
    "scipy>=1.14",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# Local photogrammetry extras (COLMAP itself is a separate install; see docs/LOCAL_GPU_SETUP.md).
reconstruction = ["ai3d-engine[reconstruction]"]
# USDZ export (Pixar USD, TOST-1.0 licence). Without it USDZ is listed as unavailable.
usdz = ["usd-core>=25.5"]
# Optional error reporting (off unless AI3D_SENTRY_DSN is set). See docs/ERROR_REPORTING.md.
errors = ["sentry-sdk>=2.73"]  # data_collection option
# S3-compatible object storage (AWS S3, MinIO, Ceph, R2, ...) instead of the data folder.
s3 = ["boto3>=1.35"]

[project.scripts]
ai3d-server = "ai3d.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai3d"]

[tool.uv.sources]
ai3d-engine = { workspace = true }
