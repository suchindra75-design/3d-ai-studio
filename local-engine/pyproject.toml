[project]
name = "ai3d-engine"
version = "0.1.0"
description = "AI 3D Studio local processing engine: hardware detection and local reconstruction runners"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "psutil>=6.1",
]

[project.optional-dependencies]
# Point-cloud filtering for photogrammetry. Open3D 0.20 dropped Intel macOS;
# 0.19 is the last release with a wheel for it (universal2, Python 3.11/3.12).
reconstruction = [
    "open3d==0.19.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "open3d>=0.20; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai3d_engine"]
