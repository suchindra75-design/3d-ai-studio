# Release builds: desktop apps with the bundled local engine, and container images.
#
# Runs when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0) or by
# hand. Desktop builds go to a *draft* GitHub release for a maintainer to check and
# publish; images go to GitHub Container Registry. See docs/RELEASING.md.
#
# Code signing is optional and only happens when the secrets exist:
#   macOS:   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#            APPLE_SIGNING_IDENTITY, and for notarization APPLE_ID, APPLE_PASSWORD
#            (app-specific password), APPLE_TEAM_ID
#   Windows: not configured yet (builds are unsigned; SmartScreen will warn)
# Without them the builds are unsigned, which the release notes must say.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    permissions:
      contents: write # create the draft release and upload files
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
          - name: macOS Intel
            os: macos-13
          - name: Linux x64
            os: ubuntu-22.04
          - name: Windows x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The engine (CPython + backend, built for this OS/CPU) with a smoke test.
      - run: pnpm bundle:engine
      - name: Build the app
        shell: bash
        env:
          CI: 'true' # DMG without the Finder layout step (no GUI session on runners)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @ai3d/desktop tauri build --config src-tauri/tauri.bundle-engine.conf.json
      - name: Licences of the bundled engine
        shell: bash
        run: |
          cp apps/desktop/src-tauri/resources/backend/THIRD_PARTY_LICENSES.txt \
            "THIRD_PARTY_LICENSES-${{ runner.os }}-${{ runner.arch }}.txt"
      - name: Upload to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: false
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            THIRD_PARTY_LICENSES-*.txt
      - name: Keep the build (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/
            THIRD_PARTY_LICENSES-*.txt
          retention-days: 7

  images:
    name: Container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            dockerfile: infrastructure/docker/backend.Dockerfile
          - image: web
            dockerfile: infrastructure/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
